<div class="dialog-title">
    <p data-bind="txt">새소식 수정</p>
</div>
<div class="dialog-content">
    <strong data-bind="txt" class="fs-18 fw-b ell-2">{{title}}</strong>
    <i class="hr my-12"></i>
    <div class="mt-16 wb-all" data-bind="html">{{content}}</div>
</div>
<div class="btn-wrap jc-c">
    <button class="btn md" data-act="close">취소</button>
    <button class="btn md bg-point">적용</button>
</div>
