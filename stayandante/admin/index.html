        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>스테이안단테펜션 | 관리자</title>
        <link rel="icon" type="image/x-icon" href="/images/common/favicon.ico" />

        <link rel="stylesheet" href="/css/common.css" />
        <style>
            body {
                padding: 2.4rem;
            }
            #loginDiv {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0 auto;
                width: 24rem;
                gap: 1.2rem;
            }
        </style>
    </head>
    <body>

            <defs>
                <style>
                    symbol {
                        fill: none;
                        stroke: currentColor;
                        stroke-width: 1.5;
                        stroke-linecap: round;
                        stroke-linejoin: round;
                    }
                </style>
            </defs>
            <symbol id="brand-stay" viewBox="0 0 72 44">
                <title>brand-stay</title>
                <desc>스테이안단테</desc>
                <path

        <h1 class="flx col jc-c ai-c fs-20 gap-12 mt-0 pt-8">
            <svg style="width: 7.2rem; height: 4.4rem"><use href="#brand-stay"></use></svg>
            관리자 페이지
        </h1>
        <!-- ================== 로그인 ================== -->
        <form id="loginDiv">
            <input type="text" id="loginId" placeholder="ID" />
            <input type="password" id="loginPw" placeholder="PW" />
            <button id="loginBtn" class="btn sm bg-point">로그인</button>
        </form>
        <div id="adminDiv" class="mw-1024" style="display: none">
            <div class="tab-wrap lg">
                <button data-tab="tab01">뉴스</button>
                <button data-tab="tab02">FAQ</button>
            </div>
            <!-- ================== 뉴스 ================== -->
            <div id="tab01">
                <div class="flx jc-e">
                    <button id="addNewsBtn" class="btn sm bg-point">추가</button>
                </div>
                <div class="tb-wrap">
                    <table id="newsTable">
                        <colgroup>
                            <col style="width: 4rem" />
                            <col style="width: 6rem" />
                            <col style="width: auto" />
                            <col style="width: auto" />
                            <col style="width: 12rem" />
                        </colgroup>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tag</th>
                                <th>Title</th>
                                <th>Content</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th class="ta-c">00</th>
                                <th class="ta-c">새소식</th>
                                <th>Title</th>
                                <th>Content</th>
                                <th>
                                    <button class="btn sm bg-point">저장</button>
                                    <button class="btn sm bg-red">삭제</button>
                                </th>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <h2 class="fs-18 ta-c">이미지 업로드</h2>
                <div class="flx gap-12">
                    <input type="file" id="imgFile" multiple />
                    <button id="uploadBtn" class="btn sm bg-point">업로드</button>
                </div>
                <div id="imgList"></div>
            </div>
            <!-- ================== FAQ ================== -->
            <div id="tab02">
                <div class="flx jc-e">
                    <button id="addFaqBtn" class="btn sm bg-point">추가</button>
                </div>
                <div class="tb-wrap">
                    <table id="faqTable">
                        <colgroup>
                            <col style="width: 4rem" />
                            <col style="width: 6rem" />
                            <col style="width: auto" />
                            <col style="width: auto" />
                            <col style="width: 12rem" />
                        </colgroup>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Question</th>
                                <th>Answer</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th>00</th>
                                <th>새소식</th>
                                <th>Title</th>
                                <th>Content</th>
                                <th>
                                    <button class="btn sm bg-point">저장</button>
                                    <button class="btn sm bg-red">삭제</button>
                                </th>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/gh/qoalstjd/common@v1.0.492/js/ui.js"></script>
        <script>
            ui.init();

            const loginDiv = document.getElementById("loginDiv");
            const adminDiv = document.getElementById("adminDiv");
            // ================== 로그인 ==================
            document.getElementById("loginBtn").onclick = async (e) => {
                e.preventDefault();
                const res = await fetch("login.php", {
                    method: "POST",
                    body: JSON.stringify({ id: loginId.value, pw: loginPw.value }),
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                });
                const data = await res.json();
                if (data.success) {
                    loginDiv.style.display = "none";
                    adminDiv.style.display = "block";
                    loadNews();
                    loadFaq();
                } else {
                    alert("로그인 실패");
                }
            };

            // ================== 뉴스 ==================
            async function loadNews() {
                const res = await fetch("/api/news.php?action=list", {
                    credentials: "same-origin",
                });
                const news = await res.json();
                const tbody = document.querySelector("#newsTable tbody");
                tbody.innerHTML = "";
                news.forEach((n) => {
                    const tr = document.createElement("tr");

                    const tagSelect = `<select data-field="tag">
                        ${["새소식", "공지"].map((t) => `<option value="${t}" ${t === n.tag ? "selected" : ""}>${t}</option>`).join("")}
                    </select>`;
                    tr.innerHTML = `
                        <td class="ta-c">${n.id}</td>
                        <td class="ta-c">${tagSelect}</td>
                        <td contenteditable data-field="title">${n.title}</td>
                        <td contenteditable data-field="content">${n.content}</td>
                        <td>
                            <button class="btn sm bg-point" onclick="editNews(${n.id}, this)">저장</button>
                            <button class="btn sm bg-red" onclick="deleteNews(${n.id})">삭제</button>
                        </td>`;
                    tbody.appendChild(tr);
                });
            }

            async function editNews(id, btn) {
                const tr = btn.closest("tr");
                const form = new FormData();
                form.append("id", id);
                form.append("tag", tr.querySelector('[data-field="tag"]').value);
                form.append("title", tr.querySelector('[data-field="title"]').textContent);
                form.append("content", tr.querySelector('[data-field="content"]').textContent);
                await fetch("/api/news.php?action=edit", {
                    method: "POST",
                    body: form,
                    credentials: "same-origin",
                });
                loadNews();
            }

            async function deleteNews(id) {
                if (!confirm("삭제할까요?")) return;
                await fetch(`/api/news.php?action=delete&id=${id}`, {
                    credentials: "same-origin",
                });
                loadNews();
            }

            // ================== 이미지 ==================
            async function loadImages() {
                const res = await fetch("/api/upload.php?action=list", {
                    credentials: "same-origin",
                });
                const imgs = await res.json();
                imgList.innerHTML = "";
                imgs.forEach((i) => {
                    const div = document.createElement("div");
                    div.innerHTML = `
                        <img src="${i.url}" width="80">
                        <span>${i.url}</span>
                        <button onclick="deleteImage(${i.id})">삭제</button>
                    `;
                    imgList.appendChild(div);
                });
            }

            async function deleteImage(id) {
                if (!confirm("삭제할까요?")) return;
                await fetch(`/api/upload.php?action=delete&id=${id}`, {
                    credentials: "same-origin",
                });
                loadImages();
            }

            uploadBtn.onclick = async () => {
                const files = imgFile.files;
                if (!files.length) return;
                for (let f of files) {
                    const form = new FormData();
                    form.append("file", f);
                    await fetch("/api/upload.php?action=upload", {
                        method: "POST",
                        body: form,
                        credentials: "same-origin",
                    });
                }
                imgFile.value = "";
                loadImages();
            };

            // ================== FAQ ==================
            async function loadFaq() {

                async function loadFaq() {
                    const res = await fetch("/api/faq.php?action=list", {
                        credentials: "same-origin",
                    });
                    const faqs = await res.json();
                    const tbody = document.querySelector("#faqTable tbody");
                    tbody.innerHTML = "";

                    faqs.forEach((f) => {
                        const tr = document.createElement("tr");

                        const typeSelect = `<select data-field="type">
                            ${["예약", "편의", "기타"].map((t) => `<option value="${t}" ${t === f.type ? "selected" : ""}>${t}</option>`).join("")}
                        </select>`;

                        tr.innerHTML = `
                            <td class="ta-c">${f.id}</td>
                            <td class="ta-c">${typeSelect}</td>
                            <td contenteditable data-field="question">${f.question}</td>
                            <td contenteditable data-field="answer">${f.answer}</td>
                            <td>
                                <button class="btn sm bg-point" onclick="editFaq(${f.id}, this)">저장</button>
                                <button class="btn sm bg-red" onclick="deleteFaq(${f.id})">삭제</button>
                            </td>`;
                        tbody.appendChild(tr);
                    });
                }
            }

            async function editFaq(id, btn) {
                const tr = btn.closest("tr");
                const form = new FormData();
                form.append("id", id);
                form.append("type", tr.querySelector('[data-field="type"]').value);
                form.append("question", tr.querySelector('[data-field="question"]').textContent);
                form.append("answer", tr.querySelector('[data-field="answer"]').textContent);
                await fetch("/api/faq.php?action=edit", {
                    method: "POST",
                    body: form,
                    credentials: "same-origin",
                });
                loadFaq();
            }

            async function deleteFaq(id) {
                if (!confirm("삭제할까요?")) return;
                await fetch(`/api/faq.php?action=delete&id=${id}`, {
                    credentials: "same-origin",
                });
                loadFaq();
            }
        </script>
    </body>
</html>
