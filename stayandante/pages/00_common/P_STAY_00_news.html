<div class="dialog-title">
    <p data-bind="txt">{{tag}}</p>
</div>
<div class="dialog-content">
    <strong data-bind="txt" class="fs-18 fw-b ell-2">{{title}}</strong>
    <div class="flx ai-c gap-8 fs-14 txt-500 mt-4">

    </div>
    <i class="hr my-12"></i>
    <div class="md-content mt-16 wb-all" data-bind="html">{{content}}</div>
</div>
