<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>Menu List</title>
        <style>
            body {
                font-family: system-ui;
                padding: 20px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th,
            td {
                border: 1px solid #ddd;
                padding: 8px 10px;
            }
            th {
                background: #f5f5f5;
                text-align: left;
            }
            tr:hover {
                background: #fafafa;
            }
            .depth-1 {
                font-weight: 700;
            }
            .depth-2 {
                padding-left: 12px;
            }
            .depth-3 {
                padding-left: 24px;
                color: #666;
            }
        </style>
    </head>
    <body>
        <h1>Menu List</h1>

        <table>
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Name</th>
                    <th>Depth</th>
                    <th>Parent</th>
                    <th>Path</th>
                </tr>
            </thead>
            <tbody id="menuBody"></tbody>
        </table>

        <script>
            fetch("/baelog/js/menu.json")
                .then((r) => r.json())
                .then((data) => {
                    const tbody = document.getElementById("menuBody");

                    Object.entries(data).forEach(([key, item]) => {
                        const tr = document.createElement("tr");

                        tr.innerHTML = `
                            <td>${key}</td>
                            <td class="depth-${item.depth}">${item.name}</td>
                            <td>${item.depth}</td>
                            <td>${item.parent?.join(", ") || "-"}</td>
                            <td>${item.path}</td>
                        `;

                        tbody.appendChild(tr);
                    });
                });
        </script>
    </body>
</html>
