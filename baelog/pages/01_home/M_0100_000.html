<div data-bind="clock">
    <p class="day">
        <span>SUN</span>
        <span>MON</span>
        <span>TUE</span>
        <span>WED</span>
        <span>THU</span>
        <span>FRI</span>
        <span>SAT</span>
    </p>
    <p class="date">8888/88/88</p>
    <p class="time">HH:mm:ss</p>
</div>
<div data-bind="weather"></div>

<div data-bind="news">
    <div class="tab-wrap">
        <button data-genre="top" class="active">인기</button>
        <button data-genre="entertainment">연예</button>
        <button data-genre="sports">스포츠</button>
        <button data-genre="technology">테크</button>
    </div>
    <ul class="news-list"></ul>
</div>
<div data-bind="music">
    <div class="player">
        <p data-bind="title"></p>

        <div class="range">
            <span data-bind="cur">00:00</span>
            <input type="range" min="0" value="0" />
            <span data-bind="dur">00:00</span>
        </div>

        <div class="control">
            <button data-act="prev">◀</button>
            <button data-act="play">▶</button>
            <button data-act="next">▶▶</button>
        </div>
    </div>

    <ul data-bind="list"></ul>
</div>
<div data-bind="calendar">
    <div class="header">
        <button data-act="prev">‹</button>
        <p data-act="today" class="title"></p>
        <button data-act="next">›</button>
    </div>

    <div class="days" data-days></div>
</div>
<div data-bind="todo">
    <div class="txt-center">
        <p class="b2 col-t01">꿈을 쫓는 자가 세상을 움직인다</p>
        <p class="b3 col-t02">- 헨리 데이비드 소로 -</p>
    </div>

    <ul data-bind="list">
        <li class="b3 txt-center">2024년 5월 31일</li>
    </ul>

    <form data-bind="form">
        <input type="text" placeholder="추가할 항목을 입력해주세요..." />
        <button class="icon16-btn">
            <i class="icon16-pm-send">추가</i>
        </button>
    </form>
</div>

<!-- modal -->
<div class="modal" hidden>
    <div class="modal-dim"></div>
    <div class="modal-box">
        <button class="close">×</button>
        <h4 class="title"></h4>
        <div class="content"></div>
    </div>
</div>
<script>
    (() => {
        const clock = {
            init() {
                this.root = document.querySelector('[data-bind="clock"]');
                if (!this.root) return;
                this.dayEls = this.root.querySelectorAll(".day span");
                this.dateEl = this.root.querySelector(".date");
                this.timeEl = this.root.querySelector(".time");
                this.update();
                setInterval(() => this.updateTime(), 1000);
                setInterval(() => this.updateDate(), 60000);
            },
            update() {
                this.updateDate();
                this.updateTime();
            },
            updateDate() {
                const d = new Date();
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, "0");
                const day = String(d.getDate()).padStart(2, "0");
                this.dateEl.textContent = `${y}/${m}/${day}`;
                const cur = d.getDay();
                this.dayEls.forEach((el, i) => el.classList.toggle("is-active", i === cur));
            },
            updateTime() {
                const d = new Date();
                const h = String(d.getHours()).padStart(2, "0");
                const m = String(d.getMinutes()).padStart(2, "0");
                const s = String(d.getSeconds()).padStart(2, "0");
                this.timeEl.textContent = `${h}:${m}:${s}`;
            },
        };

        const calendar = {
            el: document.querySelector("[data-bind='calendar']"),
            date: new Date(),

            init() {
                this.title = this.el.querySelector(".title");
                this.daysEl = this.el.querySelector("[data-days]");

                this.el.addEventListener("click", (e) => {
                    if (e.target.dataset.action === "prev") this.prev();
                    if (e.target.dataset.action === "next") this.next();
                    if (e.target.dataset.action === "today") this.today();
                });

                this.render();
            },

            render() {
                const y = this.date.getFullYear();
                const m = this.date.getMonth();
                const firstDay = new Date(y, m, 1).getDay();
                const totalDays = new Date(y, m + 1, 0).getDate();
                const today = new Date().toDateString();

                this.title.textContent = `${y}년 ${m + 1}월`;
                this.daysEl.innerHTML = "";

                // prev
                for (let i = firstDay - 1; i >= 0; i--) {
                    this.daysEl.append(this.day(new Date(y, m, -i).getDate(), "prev"));
                }

                // current
                for (let i = 1; i <= totalDays; i++) {
                    const d = new Date(y, m, i);
                    let cls = "";
                    if (d.toDateString() === today) cls = "today";
                    if (d.getDay() === 0) cls += " txt-red";
                    if (d.getDay() === 6) cls += " txt-blue";

                    this.daysEl.append(this.day(i, cls));
                }

                // next
                const remain = 42 - (firstDay + totalDays);
                for (let i = 1; i <= remain; i++) {
                    this.daysEl.append(this.day(i, "next"));
                }
            },

            day(text, cls = "") {
                const div = document.createElement("div");
                div.className = `day ${cls}`;
                div.textContent = text;
                return div;
            },

            prev() {
                this.date = new Date(this.date.getFullYear(), this.date.getMonth() - 1);
                this.render();
            },

            next() {
                this.date = new Date(this.date.getFullYear(), this.date.getMonth() + 1);
                this.render();
            },

            today() {
                this.date = new Date();
                this.render();
            },
        };

        const news = {
            API: "https://qoalstjdapis.vercel.app/api/getNews",
            genres: ["top", "entertainment", "sports", "technology"],
            state: {
                genre: "top",
                news: [],
                paused: false,
            },
            init() {
                this.wrap = document.querySelector("[data-bind='news']");
                this.list = this.wrap.querySelector(".news-list");
                this.tabs = this.wrap.querySelectorAll("[data-genre]");
                this.modal = document.querySelector(".modal");

                this.bind();
                this.fetch();
                this.auto();
            },
            bind() {
                this.tabs.forEach((btn) => {
                    btn.addEventListener("click", () => this.changeGenre(btn.dataset.genre));
                });
                this.wrap.onmouseenter = () => (this.state.paused = true);
                this.wrap.onmouseleave = () => (this.state.paused = false);
                this.modal.querySelector(".close").onclick = this.modal.querySelector(".modal-dim").onclick = () => (this.modal.hidden = true);
            },
            // 뉴스 데이터 fetch 함수 수정
            async fetch() {
                const cached = localStorage.getItem("cachedNews");
                const time = localStorage.getItem("cachedTime");
                const now = Date.now();
                if (cached && time && now - time < 3600000) {
                    this.state.news = JSON.parse(cached);
                    this.render();
                    return;
                }
                const result = [];
                for (const g of this.genres) {
                    const res = await fetch(`${this.API}?category=${g}`);
                    const json = await res.json();
                    if (json.error) {
                        console.error("뉴스 데이터 로드 오류:", json.error);
                        return;
                    }
                    json.forEach((n) => result.push({ ...n, genre: g }));
                }
                this.state.news = result;
                localStorage.setItem("cachedNews", JSON.stringify(result));
                localStorage.setItem("cachedTime", now);
                this.render();
            },
            render() {
                this.list.innerHTML = "";
                this.state.news.filter((n) => n.genre === this.state.genre).forEach((n) => this.item(n));
            },
            item(n) {
                const li = document.createElement("li");
                li.innerHTML = `
                    <img src="${n.img || ""}">
                    <p>${n.title}</p>
                    <p>
                        <span>${this.format(new Date(n.date))}</span>
                        <span>${n.auth}</span>
                    </p>
                `;
                li.onclick = () => {
                    console.log(n);
                    window.dialog.open({
                        url: "/baelog/pages/01_home/P_0100_010.html",
                        data: n,
                    });
                };
                this.list.appendChild(li);
            },
            changeGenre(g) {
                this.state.genre = g;
                this.tabs.forEach((b) => b.classList.toggle("active", b.dataset.genre === g));
                this.list.scrollTop = 0;
                this.render();
            },
            auto() {
                setInterval(() => {
                    if (this.state.paused) return;
                    const i = this.genres.indexOf(this.state.genre);
                    this.changeGenre(this.genres[(i + 1) % this.genres.length]);
                }, 20000);
            },
            format(d) {
                const z = (n) => String(n).padStart(2, "0");
                return `${z(d.getMonth() + 1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
            },
        };

        const music = {
            data: [
                { title: "음악01", src: "https://media.w3.org/2010/07/bunny/04-Death_Becomes_Fur.mp3" },
                { title: "음악02", src: "https://media.w3.org/2010/07/bunny/04-Death_Becomes_Fur.mp3" },
                { title: "음악03", src: "https://media.w3.org/2010/07/bunny/04-Death_Becomes_Fur.mp3" },
            ],
            idx: 0,
            audio: new Audio(),

            init() {
                this.wrap = document.querySelector('[data-bind="music"]');
                if (!this.wrap) return;

                this.title = this.wrap.querySelector('[data-bind="title"]');
                this.cur = this.wrap.querySelector('[data-bind="cur"]');
                this.dur = this.wrap.querySelector('[data-bind="dur"]');
                this.range = this.wrap.querySelector('input[type="range"]');
                this.list = this.wrap.querySelector('[data-bind="list"]');

                this.bind();
                this.renderList();
                this.load();
            },

            bind() {
                this.wrap.addEventListener("click", (e) => {
                    const a = e.target.dataset.action;
                    if (a === "play") this.toggle();
                    if (a === "prev") this.prev();
                    if (a === "next") this.next();
                });

                this.range.addEventListener("input", () => {
                    this.audio.currentTime = this.range.value;
                });

                this.audio.addEventListener("timeupdate", () => {
                    this.range.value = this.audio.currentTime;
                    this.cur.textContent = this.fmt(this.audio.currentTime);
                });

                this.audio.addEventListener("loadedmetadata", () => {
                    this.range.max = this.audio.duration;
                    this.dur.textContent = this.fmt(this.audio.duration);
                });

                this.audio.addEventListener("ended", () => this.next());
            },

            load() {
                const cur = this.data[this.idx];
                this.audio.src = cur.src;
                this.title.textContent = cur.title;
                this.updateActive();
            },

            toggle() {
                this.audio.paused ? this.audio.play() : this.audio.pause();
            },

            prev() {
                this.idx = (this.idx - 1 + this.data.length) % this.data.length;
                this.load();
            },

            next() {
                this.idx = (this.idx + 1) % this.data.length;
                this.load();
            },

            renderList() {
                this.list.innerHTML = "";
                this.data.forEach((d, i) => {
                    const li = document.createElement("li");
                    li.textContent = d.title;
                    li.onclick = () => {
                        this.idx = i;
                        this.load();
                    };
                    this.list.appendChild(li);
                });
            },

            updateActive() {
                [...this.list.children].forEach((li, i) => li.classList.toggle("active", i === this.idx));
            },

            fmt(t) {
                const m = String(Math.floor(t / 60)).padStart(2, "0");
                const s = String(Math.floor(t % 60)).padStart(2, "0");
                return `${m}:${s}`;
            },
        };

        const todo = {
            data: [
                { id: 1, content: "할 일 1" },
                { id: 2, content: "할 일 2" },
                { id: 3, content: "할 일 3" },
            ],

            init() {
                this.wrap = document.querySelector('[data-bind="todo"]');
                this.list = this.wrap.querySelector('[data-bind="list"]');
                this.form = this.wrap.querySelector('[data-bind="form"]');
                this.input = this.form.querySelector("input");

                this.bind();
                this.render();
            },

            bind() {
                this.form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    if (!this.input.value.trim()) return;

                    this.data.push({
                        id: Date.now(),
                        content: this.input.value,
                    });

                    this.input.value = "";
                    this.render();
                });

                this.list.addEventListener("click", (e) => {
                    const del = e.target.closest('[data-act="delete"]');
                    if (!del) return;

                    const id = +del.dataset.id;
                    if (!confirm("삭제하시겠습니까?")) return;

                    this.data = this.data.filter((v) => v.id !== id);
                    this.render();
                });
            },

            render() {
                this.list.innerHTML = `<li class="b3 txt-center">2024년 5월 31일</li>`;

                this.data.forEach((v) => {
                    this.list.insertAdjacentHTML(
                        "beforeend",
                        `
        <li>
          <p class="b2">${v.content}</p>
          <div>
            <button class="icon16-btn">
              <i class="icon16-pm-check">체크</i>
            </button>
            <button class="icon16-btn">
              <i class="icon16-pm-pencil">수정</i>
            </button>
            <button class="icon16-btn" data-act="delete" data-id="${v.id}">
              <i class="icon16-pm-trashcan">삭제</i>
            </button>
          </div>
        </li>
      `
                    );
                });
            },
        };

        const weather = {
            state: {
                loading: true,
                data: [],
                shortly: [],
                coord: { lat: 35, lon: 135 },
                baseTime: "",
                curIndex: 0,
                curType: "tmp",
            },

            init() {
                this.root = document.querySelector('[data-bind="weather"]');
                this.setBaseTime();
                this.fetch();
                this.bind();
            },

            bind() {
                this.root.addEventListener("click", (e) => {
                    const tab = e.target.closest("[data-type]");
                    const item = e.target.closest("[data-index]");
                    if (tab) {
                        this.state.curType = tab.dataset.type;
                        this.render();
                    }
                    if (item) {
                        this.state.curIndex = +item.dataset.index;
                        this.render();
                    }
                });
            },

            setBaseTime() {
                const h = new Date().getHours();
                const f = (n) => String(n).padStart(2, "0") + "00";
                this.state.baseTime = h <= 1 ? f(23) : h % 3 === 1 ? f(h - 2) : h % 3 === 2 ? f(h) : f(h - 1);
            },

            async fetch() {
                const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
                const cache = localStorage.getItem("weather");
                const time = localStorage.getItem("weather_time");
                const now = Date.now();

                if (cache && now - time < 3600000) {
                    this.state.data = JSON.parse(cache);
                } else {
                    const WEATHER_API_URL = "null";
                    const url = `${WEATHER_API_URL}&base_date=${today}&base_time=${this.state.baseTime}&nx=${this.state.coord.lat}&ny=${this.state.coord.lon}`;
                    const res = await fetch(url).then((r) => r.json());
                    this.state.data = res.response.body.items.item.map(this.filter).filter(Boolean);

                    localStorage.setItem("weather", JSON.stringify(this.state.data));
                    localStorage.setItem("weather_time", now);
                }

                this.state.shortly = this.groupByTime(this.state.data);
                this.state.loading = false;
                this.render();
            },

            filter(v) {
                if (["UUU", "VVV", "WAV"].includes(v.category)) return;
                const { baseDate, baseTime, nx, ny, ...rest } = v;
                return rest;
            },

            groupByTime(data) {
                const g = {};
                data.forEach((v) => {
                    const k = v.fcstDate + v.fcstTime;
                    g[k] ??= { date: v.fcstDate, time: v.fcstTime, values: [] };
                    g[k].values.push({
                        category: v.category,
                        value: this.format(v.fcstValue, v.category),
                    });
                });
                return Object.values(g).slice(0, 8);
            },

            format(v, c) {
                const map = {
                    TMP: v,
                    POP: v + "%",
                    WSD: v + "m/s",
                    REH: v + "%",
                    PCP: v === "강수없음" ? "0mm" : v,
                    SKY: v === "1" ? "맑음" : v === "3" ? "구름많음" : "흐림",
                    PTY: ["없음", "비", "비/눈", "눈", "소나기"][v],
                };
                return map[c] || v;
            },

            render() {
                if (this.state.loading) {
                    this.root.innerHTML = `<div class="loading"></div>`;
                    return;
                }

                const cur = this.state.shortly[this.state.curIndex];

                this.root.innerHTML = `
      <p class="h3">Seoul, Korea</p>

      <div class="tab-wrap">
        ${["tmp", "pop", "pcp", "wsd"]
            .map(
                (t) =>
                    `<button data-type="${t}" class="${this.state.curType === t ? "active" : ""}">
            ${{ tmp: "기온", pop: "강수확률", pcp: "강수량", wsd: "풍속" }[t]}
          </button>`
            )
            .join("")}
      </div>

      <ul class="details">
        ${this.state.shortly
            .map(
                (v, i) => `
          <li data-index="${i}" class="${i === this.state.curIndex ? "active" : ""}">
            <p>${v.time.slice(0, 2)}시</p>
          </li>
        `
            )
            .join("")}
      </ul>
    `;
            },
        };

        clock.init();
        calendar.init();
        news.init();
        music.init();
        todo.init();
        weather.init();

        // window.dialog.open({
        //     html: "<p>dim 없는 팝업</p>",
        //     dim: false
        // });
    })();
</script>
