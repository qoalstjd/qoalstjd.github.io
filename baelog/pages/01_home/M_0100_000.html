<!-- 시계 -->
<div data-bind="clock">
    <p class="day">
        <span>SUN</span>
        <span>MON</span>
        <span>TUE</span>
        <span>WED</span>
        <span>THU</span>
        <span>FRI</span>
        <span>SAT</span>
    </p>
    <p class="date">8888/88/88</p>
    <p class="time">HH:mm:ss</p>
</div>
<!-- 날씨 -->
<div data-bind="weather">
    <p class="fs-20 fw-700">Seoul, Korea</p>
    <div class="detail">
        <i class="ico wh-80" data-ico="shine"></i>
        <p>##<sup>°C</sup></p>
        <ul>
            <li>강수확률 : 0%</li>
            <li>습도 : 55%</li>
            <li>풍속 : 3.8m/s</li>
        </ul>
        <ul>
            <li>2025년 12월 30일</li>
            <li>22시</li>
            <li>shine</li>
        </ul>
    </div>
    <div class="tab-wrap">
        <button data-tab="tab11">기온</button>
        <button data-tab="tab12">강수확률</button>
        <button data-tab="tab13">강수량</button>
        <button data-tab="tab14">풍속</button>
    </div>
    <div>
        <div id="tab11">기온</div>
        <div id="tab12">강수확률</div>
        <div id="tab13">강수량</div>
        <div id="tab14">풍속</div>
    </div>
    <ul class="list"></ul>
</div>
<!-- 뉴스 -->
<div data-bind="news">
    <div class="tab-wrap">
        <button data-category="top" class="is-active">인기</button>
        <button data-category="entertainment">연예</button>
        <button data-category="sports">스포츠</button>
        <button data-category="technology">테크</button>
    </div>
    <ul class="news-list"></ul>
</div>
<!-- 음악 -->
<div data-bind="music">
    <div class="detail"></div>
    <div class="player">
        <audio></audio>
        <div class="timeline">
            <span class="now">0:00</span>
            <div class="progress">
                <progress value="0" max="0"></progress>
                <input type="range" class="seek range" min="0" value="0" />
            </div>
            <span class="total">0:00</span>
        </div>
        <div class="volume">
            <i class="ico wh-16" data-ico="speaker">볼륨</i>
            <div class="progress">
                <progress class="volPg" max="100" value="50"></progress>
                <input class="vol range" type="range" min="0" max="100" value="50" />
            </div>
        </div>
        <div class="control">
            <button data-act="prev" class="ico-wrap pd-4">
                <i class="ico wh-20" data-ico="skipprev"></i>
            </button>
            <button data-act="toggle" class="ico-wrap pd-4">
                <i class="ico wh-20" data-ico="play"></i>
            </button>
            <button data-act="next" class="ico-wrap pd-4">
                <i class="ico wh-20" data-ico="skipnext"></i>
            </button>
        </div>
    </div>
    <ul class="playlist"></ul>
</div>
<div data-bind="calendar">
    <div class="header flx jc-bt">
        <button data-act="prev" class="ico-wrap pd-4" data-tip="이전월">
            <i class="ico wh-16" data-ico="prev"></i>
        </button>
        <button data-act="today" class="title"></button>
        <button data-act="next" class="ico-wrap pd-4" data-tip="다음월">
            <i class="ico wh-16" data-ico="next"></i>
        </button>
    </div>
    <div class="dates"></div>
</div>
<div data-bind="todo">
    <div class="txt-c">
        <p class="txt-700">꿈을 쫓는 자가 세상을 움직인다</p>
        <p class="txt-500">- 헨리 데이비드 소로 -</p>
    </div>
    <p class="txt-c">YYYY년 MM월 DD일</p>
    <ul data-bind="list"></ul>
    <form data-bind="form">
        <input type="text" placeholder="추가할 항목을 입력해주세요..." />
        <button class="ico-wrap">
            <i class="ico wh-16" data-ico="send">추가</i>
        </button>
    </form>
</div>

<script>
    (() => {
        // 시계
        const clock = {
            root: document.querySelector('[data-bind="clock"]'),
            now: null,
            init() {
                if (!this.root) return;
                this.dayEls = this.root.querySelectorAll(".day span");
                this.dateEl = this.root.querySelector(".date");
                this.timeEl = this.root.querySelector(".time");
                this.update();
                setInterval(() => this.update(), 1000);
            },
            update() {
                this.now = new Date();
                this.updateDate();
                this.updateTime();
            },
            updateDate() {
                this.dateEl.textContent = window.formatDate(this.now, "YYYY/MM/DD");
                const cur = this.now.getDay();
                this.dayEls.forEach((el, i) => el.classList.toggle("is-active", i === cur));
            },
            updateTime() {
                this.timeEl.textContent = window.formatDate(this.now, "HH:mm:ss");
            },
        };
        // 날씨
        const weather = {
            root: document.querySelector('[data-bind="weather"]'),
            async init() {
                this.detailEl = this.root.querySelector(".detail");
                this.listEl = this.root.querySelector(".list");
                this.loading(true);
                try {
                    this.data = (await window.fetchManager.get("https://qoalstjdapis.vercel.app/api/getWeather")) || [];
                } catch (e) {
                    console.error("날씨 불러오기 실패", e);
                    this.data = [];
                }
                this.loading(false);
                this.renderDetail(0);
                this.renderList();
            },
            renderDetail(index) {
                const d = this.data[index];
                const v = d.values;
                console.log(d);
                this.detailEl.innerHTML = `
                    <i class="ico wh-80" data-ico="${v.pty.value !== "" ? v.pty.value : v.sky.value}"></i>
                    <p>${v.tmp.value}<sup>${v.tmp.unit}</sup></p>
                    <ul>
                        <li>강수확률 : ${v.pop.value}${v.pop.unit}</li>
                        <li>습도 : ${v.reh.value}${v.reh.unit}</li>
                        <li>풍속 : ${v.wsd.value}${v.wsd.unit}</li>
                    </ul>
                    <ul>
                        <li>${window.formatDate(d.date, "YY.MM.DD")}</li>
                        <li>${d.time.slice(0, -2)}시</li>
                        <li>${v.pty.value !== "" ? v.pty.value : v.sky.value}</li>
                    </ul>`;
            },
            renderList() {
                this.listEl.innerHTML = "";
                this.data.forEach((d, i) => {
                    const sky = d.values.sky.value;
                    const pty = d.values.pty.value;
                    const li = document.createElement("li");
                    li.innerHTML = `
                        <i class="ico wh-48" data-ico="${pty !== "" ? pty : sky}"></i>
                        <p class="b3 col-t01">${d.time + "시"}</p>`;
                    li.addEventListener("click", () => {
                        this.renderDetail(i);
                    });
                    this.listEl.appendChild(li);
                });
            },
            loading(boolean) {
                this.root.classList.toggle("loading", boolean);
            },
        };
        // 뉴스
        const news = {
            root: document.querySelector("[data-bind='news']"),
            data: [],
            async init() {
                this.list = this.root.querySelector(".news-list");
                this.tabs = this.root.querySelectorAll("[data-category]");
                this.loading(true);
                try {
                    this.data = (await window.fetchManager.get("https://qoalstjdapis.vercel.app/api/getNews")) || [];
                } catch (e) {
                    console.error("뉴스 불러오기 실패", e);
                    this.data = [];
                }
                this.render("top");
                this.bind();
                this.loading(false);
            },
            render(category) {
                this.list.innerHTML = "";
                const filteredData = this.data.filter((item) => item.category === category);
                filteredData.forEach((d) => {
                    const li = document.createElement("li");
                    li.innerHTML = `
                        <img src="${d.img || ""}">
                        <p class="ell-1 fs-14">${d.title}</p>
                        <p class="flx ai-c flx-nowrap gap-4 fs-12 txt-500 of-h">
                            <span>${window.formatDate(new Date(d.date), "YYYY.MM.DD")}</span>
                            <i class="vr"></i>
                            <span class="ell-1">${d.creator}</span>
                        </p>`;
                    li.onclick = () => {
                        window.dialog.open({
                            url: "/baelog/pages/01_home/P_0100_010.html",
                            data: d,
                        });
                    };
                    this.list.appendChild(li);
                });
            },
            bind() {
                this.tabs.forEach((tab) => {
                    tab.addEventListener("click", () => {
                        this.tabs.forEach((el) => el.classList.remove("is-active"));
                        tab.classList.add("is-active");
                        this.render(tab.dataset.category);
                    });
                });
            },
            loading(boolean) {
                this.list.classList.toggle("loading", boolean);
            },
        };
        // 음악
        const music = {
            root: document.querySelector('[data-bind="music"]'),
            curIdx: 0,
            async init() {
                this.detailEl = this.root.querySelector(".detail");
                this.audio = this.root.querySelector("audio");
                this.playlistEl = this.root.querySelector(".playlist");
                this.now = this.root.querySelector(".now");
                this.total = this.root.querySelector(".total");
                this.pg = this.root.querySelector("progress");
                this.seek = this.root.querySelector(".seek");
                this.vol = this.root.querySelector(".vol");
                this.volPg = this.root.querySelector(".volPg");
                this.loading(true);
                try {
                    const res = await fetch("https://qoalstjdapis.vercel.app/api/getMusic");
                    this.data = await res.json();
                } catch {
                    this.data = [];
                }
                this.renderPlaylist();
                this.load(this.curIdx);
                this.bindControls();
                const v = Math.round(this.audio.volume * 100);
                this.vol.value = v;
                this.volPg.value = v;
                this.loading(false);
            },
            load(i) {
                this.curIdx = i;
                const d = this.data[i];
                this.detailEl.innerHTML = `
                    <img src="${d.cover}" class="wh-128 r-12">
                    <div class="mt-12 txt-c">
                        <strong>${d.title}</strong>
                        <p>${d.genre} · ${d.mood}</p>
                    </div>
                    `;
                this.audio.src = d.streaming;
                this.audio.onloadedmetadata = () => {
                    const dur = Math.floor(this.audio.duration || 0);
                    this.pg.max = this.seek.max = dur;
                    this.total.textContent = this.fm(dur);
                    this.audio.play();
                };
                this.audio.ontimeupdate = () => {
                    const cur = Math.floor(this.audio.currentTime || 0);
                    this.pg.value = this.seek.value = cur;
                    this.now.textContent = this.fm(cur);
                };
                this.audio.onplay = () => (this.root.querySelector("[data-act='toggle'] [data-ico]").dataset.ico = "pause");
                this.audio.onpause = () => (this.root.querySelector("[data-act='toggle'] [data-ico]").dataset.ico = "play");
                this.audio.onended = () => this.next();
            },

            bindControls() {
                this.root.querySelector('[data-act="prev"]').onclick = () => this.prev();
                this.root.querySelector('[data-act="next"]').onclick = () => this.next();
                this.root.querySelector('[data-act="toggle"]').onclick = () => (this.audio.paused ? this.audio.play() : this.audio.pause());
                this.seek.oninput = (e) => (this.audio.currentTime = Number(e.target.value));
                this.vol.oninput = (e) => {
                    const v = Number(e.target.value);
                    this.audio.volume = v / 100;
                    this.volPg.value = v;
                };
                this.audio.onvolumechange = () => {
                    const v = Math.round(this.audio.volume * 100);
                    this.vol.value = v;
                    this.volPg.value = v;
                };
            },
            prev() {
                this.load((this.curIdx - 1 + this.data.length) % this.data.length);
            },
            next() {
                this.load((this.curIdx + 1) % this.data.length);
            },
            renderPlaylist() {
                this.playlistEl.innerHTML = "";

                this.data.forEach((d, i) => {
                    const li = document.createElement("li");
                    li.className = "flx gap-12 pd-8 flx-nowrap r-8"
                    li.innerHTML = `
                        <img src="${d.cover}" class="wh-48 r-4">
                        <div class="of-h">
                            <strong class="ell-1">${d.title}</strong>
                            <p class="flx ai-c gap-8 txt-500">
                                <span>${d.genre}</span>
                                <i class="vr"></i>
                                <span class="ell-1">${d.mood}</span>
                        </div>
                    `;
                    li.onclick = () => {
                        this.playlistEl.querySelectorAll("li").forEach((l) => l.classList.remove("is-active"));
                        li.classList.add("is-active");
                        this.load(i);
                    };
                    this.playlistEl.appendChild(li);
                });
                this.playlistEl.children[0]?.classList.add("is-active");
            },
            fm(s) {
                const m = Math.floor(s / 60);
                const ss = String(s % 60).padStart(2, "0");
                return `${m}:${ss}`;
            },
            loading(boolean) {
                this.root.classList.toggle("loading", boolean);
            },
        };
        // 달력
        const calendar = {
            root: document.querySelector('[data-bind="calendar"]'),
            date: new Date(),
            init() {
                this.titleEl = this.root.querySelector(".title");
                this.datesEl = this.root.querySelector(".dates");
                this.root.addEventListener("click", (e) => {
                    const btn = e.target.closest("[data-act]");
                    if (!btn) return;
                    if (btn.dataset.act === "prev") this.prev();
                    if (btn.dataset.act === "next") this.next();
                    if (btn.dataset.act === "today") this.today();
                });
                this.render();
            },
            render() {
                const y = this.date.getFullYear();
                const m = this.date.getMonth();
                const firstDay = new Date(y, m, 1).getDay();
                const totalDays = new Date(y, m + 1, 0).getDate();
                const today = new Date().toDateString();

                this.titleEl.textContent = window.formatDate(this.now, "YYYY년 MM월");
                this.datesEl.innerHTML = "";
                // prev
                for (let i = firstDay - 1; i >= 0; i--) {
                    this.datesEl.append(this.day(new Date(y, m, -i).getDate(), "txt-500"));
                }
                // current
                for (let i = 1; i <= totalDays; i++) {
                    const d = new Date(y, m, i);
                    let cls = "";
                    if (d.toDateString() === today) cls = "today";
                    if (d.getDay() === 0) cls += " txt-red";
                    if (d.getDay() === 6) cls += " txt-blue";
                    this.datesEl.append(this.day(i, cls));
                }
                // next
                const remain = 42 - (firstDay + totalDays);
                for (let i = 1; i <= remain; i++) {
                    this.datesEl.append(this.day(i, "txt-500"));
                }
            },
            day(text, cls) {
                const div = document.createElement("div");
                if (cls) div.className = cls;
                div.textContent = text;
                return div;
            },
            prev() {
                this.date = new Date(this.date.getFullYear(), this.date.getMonth() - 1);
                this.render();
            },
            next() {
                this.date = new Date(this.date.getFullYear(), this.date.getMonth() + 1);
                this.render();
            },
            today() {
                this.date = new Date();
                this.render();
            },
        };
        // 할일
        const todo = {
            root: document.querySelector('[data-bind="todo"]'),
            data: [
                { id: 1, content: "할 일 1" },
                { id: 2, content: "할 일 2" },
                { id: 3, content: "할 일 3" },
            ],
            init() {
                this.list = this.root.querySelector('[data-bind="list"]');
                this.form = this.root.querySelector('[data-bind="form"]');
                this.input = this.form.querySelector("input");
                this.bind();
                this.render();
            },
            bind() {
                this.form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    if (!this.input.value.trim()) return;

                    this.data.push({
                        id: Date.now(),
                        content: this.input.value,
                    });

                    this.input.value = "";
                    this.render();
                });
                this.list.addEventListener("click", (e) => {
                    const del = e.target.closest('[data-act="delete"]');
                    if (!del) return;

                    const id = +del.dataset.id;
                    if (!confirm("삭제하시겠습니까?")) return;

                    this.data = this.data.filter((v) => v.id !== id);
                    this.render();
                });
            },
            render() {
                this.data.forEach((v) => {
                    this.list.insertAdjacentHTML(
                        "beforeend",
                        `
                            <li>
                            <p class="b2">${v.content}</p>
                            <div>
                                <button class="ico-wrap pd-4">
                                    <i class="ico wh-16" data-ico="check">체크</i>
                                </button>
                                <button class="ico-wrap pd-4">
                                    <i class="ico wh-16" data-ico="pencil">수정</i>
                                </button>
                                <button class="ico-wrap pd-4" data-act="delete" data-id="${v.id}">
                                    <i class="ico wh-16" data-ico="trashcan">삭제</i>
                                </button>
                            </div>
                            </li>`
                    );
                });
            },
        };

        clock.init();
        weather.init();
        news.init();
        calendar.init();
        todo.init();
        music.init();
    })();
</script>
