<!-- 시계 -->
<div data-bind="clock">
    <p class="date">8888/88/88</p>
    <p class="day">
        <span>SUN</span>
        <span>MON</span>
        <span>TUE</span>
        <span>WED</span>
        <span>THU</span>
        <span>FRI</span>
        <span>SAT</span>
    </p>
    <p class="time">HH:mm:ss</p>
</div>
<!-- 날씨 -->
<div data-bind="weather">
    <p class="fs-20 fw-700">Seoul, Korea</p>
    <div class="detail"></div>
    <div class="tab-wrap">
        <button data-tab="tab11">기온</button>
        <button data-tab="tab12">강수확률</button>
        <button data-tab="tab13">강수량</button>
        <button data-tab="tab14">풍속</button>
    </div>
    <div class="visual">
        <div id="tab11" data-type="tmp"></div>
        <div id="tab12" data-type="pop"></div>
        <div id="tab13" data-type="pcp"></div>
        <div id="tab14" data-type="wsd"></div>
    </div>
    <ul class="list"></ul>
</div>
<!-- 뉴스 -->
<div data-bind="news">
    <div class="tab-wrap">
        <button data-category="top" class="is-active">인기</button>
        <button data-category="entertainment">연예</button>
        <button data-category="sports">스포츠</button>
        <button data-category="technology">테크</button>
    </div>
    <ul class="news-list"></ul>
</div>
<!-- 음악 -->
<div data-bind="music">
    <div class="detail"></div>
    <div class="player">
        <audio></audio>
        <div class="timeline">
            <span class="now">0:00</span>
            <div class="progress">
                <progress value="0" max="0"></progress>
                <input type="range" class="seek range" min="0" value="0" />
            </div>
            <span class="total">0:00</span>
        </div>
        <div class="volume">
            <svg class="wh-16"><use href="/common/images/icon.svg?v=1#volume"></use></svg>
            <div class="progress">
                <progress class="volPg" max="100" value="50"></progress>
                <input class="vol range" type="range" min="0" max="100" value="50" />
            </div>
        </div>
        <div class="control">
            <button data-act="prev" class="ico-wrap pd-4" data-tip="이전곡">
                <svg class="wh-16"><use href="/common/images/icon.svg?v=1#skip-back"></use></svg>
            </button>
            <button data-act="toggle" class="ico-wrap pd-4" data-tip="재생/일시정지">
                <svg class="wh-16"><use href="/common/images/icon.svg?v=1#play"></use></svg>
                <svg class="wh-16"><use href="/common/images/icon.svg?v=1#pause"></use></svg>
            </button>
            <button data-act="next" class="ico-wrap pd-4" data-tip="다음곡">
                <svg class="wh-16"><use href="/common/images/icon.svg?v=1#skip-forward"></use></svg>
            </button>
        </div>
    </div>
    <ul class="playlist"></ul>
</div>
<div data-bind="calendar">
    <div class="header flx jc-bt">
        <button data-act="prev" class="ico-wrap pd-4" data-tip="이전월">
            <svg class="wh-16"><use href="/common/images/icon.svg?v=1#arrow-left"></use></svg>
        </button>
        <button data-act="today" class="title"></button>
        <button data-act="next" class="ico-wrap pd-4" data-tip="다음월">
            <svg class="wh-16"><use href="/common/images/icon.svg?v=1#arrow-right"></use></svg>
        </button>
    </div>
    <div class="dates"></div>
</div>
<div data-bind="todo">
    <figure class="quote">
        <blockquote>꿈을 쫓는 자가 세상을 움직인다</blockquote>
        <figcaption>헨리 데이비드 소로</figcaption>
    </figure>
    <p class="date">YYYY년 MM월 DD일</p>
    <ul class="list"></ul>
    <form class="inp">
        <input type="text" placeholder="추가할 항목을 입력해주세요..." />
        <button class="ico-wrap pd-4">
            <svg><use href="/common/images/icon.svg?v=2#send"></use></svg>
        </button>
    </form>
</div>
