<!-- 시계 -->
<div data-bind="clock">
    <p class="date">8888/88/88</p>
    <p class="day">
        <span>SUN</span>
        <span>MON</span>
        <span>TUE</span>
        <span>WED</span>
        <span>THU</span>
        <span>FRI</span>
        <span>SAT</span>
    </p>
    <p class="time">HH:mm:ss</p>
</div>
<!-- 날씨 -->
<div data-bind="weather">
    <p class="fs-20 fw-700">Seoul, Korea</p>
    <div class="detail"></div>
    <div class="tab-wrap">
        <button data-tab="tab11">기온</button>
        <button data-tab="tab12">강수확률</button>
        <button data-tab="tab13">강수량</button>
        <button data-tab="tab14">풍속</button>
    </div>
    <div class="visual">
        <div id="tab11" data-type="tmp"></div>
        <div id="tab12" data-type="pop"></div>
        <div id="tab13" data-type="pcp"></div>
        <div id="tab14" data-type="wsd"></div>
    </div>
    <ul class="list"></ul>
</div>
<!-- 뉴스 -->
<div data-bind="news">
    <div class="tab-wrap">
        <button data-category="top" class="is-active">인기</button>
        <button data-category="entertainment">연예</button>
        <button data-category="sports">스포츠</button>
        <button data-category="technology">테크</button>
    </div>
    <ul class="news-list"></ul>
</div>
<!-- 음악 -->
<div data-bind="music">
    <div class="tv">
        <div class="player"></div>
    </div>
    <ul class="playlist"></ul>
    <form class="inp has-ico">
        <input type="text" placeholder="Youtube Live Streaming URL" />
        <button class="ico-wrap pd-4 wh-24">
            <svg><use href="#act-send"></use></svg>
        </button>
    </form>
</div>
<!-- 달력 -->
<div data-bind="calendar">
    <div class="header flx jc-bt">
        <button data-act="prev" class="ico-wrap pd-4" data-tip="이전월">
            <svg class="wh-20"><use href="#dir-chevron-left"></use></svg>
        </button>
        <button data-act="today" class="title" data-tip="오늘로 가기"></button>
        <button data-act="next" class="ico-wrap pd-4" data-tip="다음월">
            <svg class="wh-20"><use href="#dir-chevron-right"></use></svg>
        </button>
    </div>
    <div class="days">
        <div class="txt-red">Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div class="txt-blue">Sat</div>
    </div>
    <div class="dates"></div>
</div>
<div data-bind="schedule">
    <figure class="quote">
        <blockquote>꿈을 쫓는 자가 세상을 움직인다</blockquote>
        <figcaption>헨리 데이비드 소로</figcaption>
    </figure>
    <p class="date">YYYY년 MM월 DD일</p>
    <ul class="list"></ul>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
