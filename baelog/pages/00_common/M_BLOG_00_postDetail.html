<div class="tit-wrap ty-post">
    <img data-bind="src onerror" src="/baelog/images/post/bnr_{{slug}}.png" data-onerror="/baelog/images/post/bnr_{{category}}.png" />
    <h1 data-bind="txt">{{title}}</h1>
    <p data-bind="txt" class="txt-700">{{summary}}</p>
    <a data-bind="txt href" href="/baelog/index.html?linkcd={{parentLinkcd}}" class="txt-500 txt-underline fs-14">{{category}}</a>
    <p data-bind="txt" class="txt-500 fs-14">{{date}}</p>
</div>
<i class="hr my-24"></i>
<div class="cont-wrap ty-post">
    <section data-bind="post"></section>
    <i class="vr"></i>
    <aside data-bind="toc">
        <div>
            <div class="box r-b-0">
                <b>On This Page</b>
                <ul class="txt-700"></ul>
            </div>
            <div class="box bg-400 flx gap-8 r-t-0 of-v">
                <a href="#related" class="ico-wrap pd-4" data-tip="관련포스트">
                    <svg><use href="#content-ul"></use></svg>
                </a>
                <a href="#comment" class="ico-wrap pd-4 ml-auto" data-tip="댓글">
                    <svg><use href="#act-comment"></use></svg>
                </a>
                <a href="#top" class="ico-wrap pd-4" data-tip="맨위로">
                    <svg><use href="#dir-arrow-totop"></use></svg>
                </a>
            </div>
        </div>
    </aside>
</div>
<section class="related-wrap box mt-32" id="related">
    <h2 data-bind="txt" class="fs-20 mb-8">{{category}}</h2>
    <div class="flx ai-c gap-12">
        <div class="ico-wrap">
            <svg class="wh-16"><use href="#content-ul"></use></svg>
            <p data-bind="txt" class="txt-500 mt-0">{{id}} / {{postLength}}</p>
        </div>
        <div class="flx ai-c gap-4">
            <svg class="wh-16"><use href="#content-clock"></use></svg>
            <p data-bind="txt" class="txt-500 mt-0">{{date}}</p>
        </div>
    </div>
    <p data-bind="txt" class="txt-700">{{summary}}</p>
    <div class="tb-wrap ty-row mt-12">
        <table>
            <caption>
                관련 포스트에 대한 표
            </caption>
            <colgroup>
                <col style="width: 3.6rem" />
                <col style="width: auto" />
                <col style="width: 10rem" />
            </colgroup>
            <tbody data-bind="relatedPost">
                <tr></tr>
            </tbody>
        </table>
    </div>
</section>
<section class="comment-wrap mt-32" id="comment">
    <ul class="box bg-200">
        <li class="flx">
            <img alt="profile" class="c-ico lazyautosizes lazyloaded" />
            <div class="c-bubble">
                <div class="c-head">
                    <p>선인장 🌵</p>
                </div>
                <p class="c-content commentMediaClass">좋은 내용 잘 읽었습니다 👍🏻</p>
                <div class="c-bottom">
                    <span class="date"><i class="far fa-clock me-1"></i>2023.03.08 11:17 <a href="" onclick="window.open(this.href, 'ThisBlogReportPopup', 'width=550, height=510, toolbar=no, menubar=no, status=no, scrollbars=no'); return false;">신고</a></span>
                    <a href="#" data-tooltip="수정/삭제">
                        <i class="far fa-comment-alt-slash fs-17px"></i>
                    </a>
                    <a href="#" data-tooltip="답글쓰기">
                        <i class="far fa-comment-alt-edit fs-17px"></i>
                    </a>
                </div>
            </div>
        </li>
    </ul>
    <form class="box" method="post" action="/comment/" onsubmit="return false" style="position: sticky; bottom: 0">
        <div class="flx">
            <p>
                <input type="text" name="name" value="" placeholder="이름" />
            </p>
            <p>
                <input type="password" maxlength="8" name="password" value="" placeholder="비밀번호" />
            </p>
        </div>
        <textarea name="" id=""></textarea>
    </form>
</section>
