<script>
    (() => {
        const fileName = history.state.fileName;
        const parentLinkcd = history.state.parentLinkcd;
        SPA.setActive(parentLinkcd);
        const els = {
            img: document.querySelector('[data-bind="img"]'),
            title: document.querySelector('[data-bind="title"]'),
            category: document.querySelector('[data-bind="category"]'),
            date: document.querySelector('[data-bind="date"]'),
            summary: document.querySelector('[data-bind="summary"]'),
            post: document.querySelector('[data-bind="post"]'),
        };
        const loadData = async () => {
            const list = await window.fetchManager.get("/baelog/js/project.json");
            const meta = list.find((p) => p.fileName === fileName);
            if (!meta) return;

            // 메타 바인딩
            // els.img.src = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1280' height='120'%3E%3Cpath fill='%23cccccc' d='M0 0h480v120H0z'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='14' font-weight='bold' fill='%230c0b0f'%3ECAT%3C/text%3E%3C/svg%3E";
            els.img.src = `/baelog/images/post/bnr_${meta.category}.png`;
            els.title.textContent = meta.title;
            els.category.textContent = meta.category;
            els.category.href = `/baelog/index.html?linkcd=${parentLinkcd || "m0000000"}`;
            els.date.textContent = meta.date;
            els.summary.textContent = meta.summary;

            const data = await window.fetchManager.get(`/baelog/pages/04_project/posts/${fileName}.html`, { parse: "text" });
            els.post.innerHTML = data;
        };
        loadData();
    })();
</script>
