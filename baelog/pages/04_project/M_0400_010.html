<div class="tit-wrap ty-post">
    <img data-bind-src="/baelog/images/post/bnr_{{category}}.png" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1280' height='120'%3E%3Cpath fill='%23cccccc' d='M0 0h480v120H0z'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='14' font-weight='bold' fill='%230c0b0f'%3E이미지%3C/text%3E%3C/svg%3E" />
    <h1 data-bind-txt="{{title}}">$Title$</h1>
    <p data-bind-txt="{{summary}}" class="txt-700">$Summary$</p>
    <a data-bind-txt="{{category}}" data-bind-href="/baelog/index.html?linkcd={{parentLinkcd}}" class="txt-500 txt-underline fs-14">$category$</a>
    <p data-bind-txt="{{date}}" class="txt-500 fs-14">$date$</p>
</div>
<div class="cont-wrap ty-post">
    <section data-bind="post"></section>
    <aside data-bind="toc">
        <div>
            <div class="box pd-16">
                <b>On This Page</b>
                <ul class="txt-700"></ul>
            </div>
            <div class="box pd-16 bg-300 flx gap-8">
                <button class="ico wh-24" data-ico="copy"><span class="hidden">링크복사</span></button>
                <a href="#comment" class="ico wh-24 ml-auto" data-ico="comment"><span class="hidden">댓글</span></a>
                <a href="#top" class="ico wh-24" data-ico="pageup"><span class="hidden">맨위로</span></a>
            </div>
        </div>
    </aside>
</div>
<section class="related-wrap box mt-32 pd-20">
    <h1 data-bind-txt="{{category}}" class="fs-20 mb-8">$category$</h1>
    <div class="flx ai-c gap-12">
        <div class="flx ai-c gap-4">
            <i class="ico wh-16" data-ico="list"><span class="hidden">리스트</span></i>
            <p data-bind-txt="{{id}} / 1" class="txt-500 mt-0">1 / 1</p>
        </div>
        <div class="flx ai-c gap-4">
            <i class="ico wh-16" data-ico="clock"><span class="hidden">시계</span></i>
            <p data-bind-txt="{{date}}" class="txt-500 mt-0">$date$</p>
        </div>
    </div>
    <p data-bind-txt="{{summary}}" class="txt-700">$summary$</p>
    <ul data-bind="relatedPost" class="mt-12"></ul>
    <!-- <button class="toggle-btn">관련 포스트 보기</button>
    <ul class="toggle-btn-target">
        <li class="relatedPosts_active__9Ub4i"><a href="flutter">1. flutter</a></li>
    </ul> -->
</section>
<script>
    (() => {
        const fileName = history.state.fileName;
        const parentLinkcd = history.state.parentLinkcd;
        const post = document.querySelector('[data-bind="post"]');
        const aside = document.querySelector('[data-bind="toc"]');
        SPA.setActive(parentLinkcd);

        const loadData = async () => {
            const list = await window.fetchManager.get("/baelog/js/project.json");
            const meta = list.find((p) => p.fileName === fileName);
            if (!meta) return;

            window.bindData(document.querySelector(".tit-wrap"), { ...meta, parentLinkcd: parentLinkcd || "m0000000" });
            window.bindData(document.querySelector(".related-wrap"), meta);

            const data = await window.fetchManager.get(`/baelog/pages/04_project/posts/${fileName}.html`, { parse: "text" });
            post.innerHTML = data;
            post.querySelectorAll("h3, h4, h5, h6").forEach((h, i) => {
                h.id = `title${String(i + 1).padStart(2, "0")}`;
                aside.querySelector("ul").innerHTML += `
                    <li class="${h.tagName === "H4" ? "pl-12" : ""}">
                        <a href="#${h.id}">${h.innerText}</a>
                    </li>
                `;
            });
            const headings = [...post.querySelectorAll("h3, h4, h5, h6")];
            const tocLinks = [...aside.querySelectorAll("a")];
            let tops = [];

            const calcTops = () => {
                tops = headings.map((h) => ({
                    id: h.id,
                    top: h.getBoundingClientRect().top + window.pageYOffset - 80,
                }));
            };
            calcTops();
            window.addEventListener("resize", calcTops);
            window.addEventListener("scroll", () => {
                const y = window.pageYOffset;
                let current = tops[0]?.id;
                for (let i = 0; i < tops.length; i++) {
                    if (y >= tops[i].top) current = tops[i].id;
                }
                tocLinks.forEach((a) => a.classList.toggle("txt-point", a.getAttribute("href") === `#${current}`));
            });

            const related = list.filter(p => p.category === meta.category);
            const relatedList = document.querySelector("[data-bind='relatedPost']")
            relatedList.innerHTML = ""; // 초기화
            if (related.length) {
                related.forEach((p, i) => {
                    const li = document.createElement("li");
                    li.innerHTML = `<a href="/baelog/index.html?linkcd=m0400010&parentLinkcd=${parentLinkcd}&fileName=${p.fileName}">${String(i+1).padStart(2,"0")}. ${p.title}</a>`;
                    relatedList.appendChild(li);
                });
            } else {
                const li = document.createElement("li");
                li.textContent = "같은 카테고리의 포스트가 없습니다.";
                relatedList.appendChild(li);
            }
        };
        loadData();
    })();
</script>
