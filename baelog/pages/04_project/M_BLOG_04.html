<div class="tit-wrap">
    <h1 data-bind="title">$Title$</h1>
    <button class="btn xs ml-auto" data-act="sort" data-sort="desc">
        날짜
        <svg class="wh-16">
            <use href="#dir-caret-up"></use>
            <use href="#dir-caret-down"></use>
        </svg>
    </button>
    <div class="flx ml-8" data-view>
        <button data-act="grid" class="ico-wrap pd-4">
            <svg><use href="#content-grid"></use></svg>
        </button>
        <button data-act="block" class="ico-wrap pd-4">
            <svg><use href="#content-block"></use></svg>
        </button>
        <button data-act="table" class="ico-wrap pd-4">
            <svg><use href="#content-table"></use></svg>
        </button>
    </div>
</div>

<ul data-bind="posts" data-postviewtype="grid"></ul>
